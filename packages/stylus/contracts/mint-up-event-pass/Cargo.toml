[package]
name = "mint-up-event-pass"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Minimal Mint Up Event Pass contract for Arbitrum Stylus"

[dependencies]
alloy-primitives = "=0.8.20"
alloy-sol-types = "=0.8.20"
cid = { version = "=0.11.3", default-features = false, features = ["alloc"] }
openzeppelin-stylus = "=0.3.0"
stylus-sdk = "=0.9.0"

[dev-dependencies]
alloy-primitives = { version = "=0.8.20", features = ["sha3-keccak"] }
stylus-sdk = { version = "=0.9.0", features = ["stylus-test"] }

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi", "openzeppelin-stylus/export-abi"]
mini-alloc = ["stylus-sdk/mini-alloc"]

[[bin]]
name = "mint-up-event-pass"
path = "src/main.rs"
test = false
bench = false

[lib]
crate-type = ["lib", "cdylib"]
